name: Node.js CI/CD

on:
  push:
    branches:
      - 'main'
    tags:
      - 'v*'
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup pnpm with Node.js runtime
        uses: pnpm/setup@v3.1.1
        with: &pnpm-setup-with
          cache: true
          require-lockfile: true

      - parallel:
          - name: OxLint
            run: pnpm lint:oxlint
          - name: ESLint
            run: pnpm lint:eslint
          - name: Oxfmt
            run: pnpm lint:oxfmt
          - name: Type Check
            run: pnpm lint:tsc

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup pnpm with Node.js runtime
        uses: pnpm/setup@v3.1.1
        with: *pnpm-setup-with

      - name: Build
        run: pnpm build
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Upload Page Artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: .output/public
          include-hidden-files: true

  deploy:
    name: Deploy
    needs: [build]
    concurrency:
      group: pages
      cancel-in-progress: true
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-slim
    timeout-minutes: 30
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
